name: better_off_local
description: Better Off Local – Consumer mobile app for discovering and redeeming local offers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Backend
  supabase_flutter: ^2.5.3

  # Maps & location
  google_maps_flutter: ^2.7.0
  geolocator: ^12.0.0

  # Storage & security
  flutter_secure_storage: ^9.2.2

  # Images
  cached_network_image: ^3.4.0

  # Internationalisation
  intl: ^0.19.0

  # External URL launching (Stripe Checkout)
  url_launcher: ^6.3.0

  # Deep link handling — universal links (HTTPS) and custom scheme fallback
  app_links: ^6.0.0

  # QR code display for redemption tokens
  qr_flutter: ^4.1.0

  # QR code scanning via camera (online checkout flow)
  mobile_scanner: ^5.2.0

  # Image picking from gallery or camera (profile avatar upload)
  image_picker: ^1.1.2

  # Relative time formatting ("2 minutes ago")
  timeago: ^3.6.1

  # Utilities
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  riverpod_generator: ^2.4.2
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/splash/
    - assets/branding/
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
